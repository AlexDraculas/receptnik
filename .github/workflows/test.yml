name: Tests

# Runs the worker unit tests, the frontend logic unit tests, and the
# full-stack integration test on every push and pull request. This is
# test-only — it never deploys anything.
# The Cloudflare Worker (worker/anthropic-proxy.js) still has to be
# redeployed manually via the Cloudflare dashboard after a merge; see
# worker/DEPLOY.md. Deploying automatically would need a Cloudflare API
# token stored as a repo secret, which is a deliberate call for a human to
# make, not something to wire up silently here.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (pinned in tests/package-lock.json) hard-requires Node
          # ^22.22.2 || ^24.15.0 || >=26 — it will not run at all on Node 20.
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Worker unit tests
        working-directory: tests
        run: npm run test:worker

      - name: Frontend logic unit tests (streak, timer)
        working-directory: tests
        run: npm run test:frontend-unit

      - name: Full-stack integration test
        working-directory: tests
        run: npm run test:integration
